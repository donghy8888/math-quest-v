<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数学探险 V2</title><style>
:root{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;color:#223452;background:#f3f6fc}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(115deg,#344ec3,#8060d5);color:#fff;padding:25px max(16px,calc((100vw - 960px)/2))}header h1{margin:0}header p{margin:6px 0}main{max-width:960px;margin:auto;padding:16px 16px 70px}.card{background:white;border:1px solid #e2e8f5;border-radius:18px;padding:20px;margin:12px 0;box-shadow:0 5px 22px #243b670a}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.grid .card{margin:0}button,.button{font:inherit;cursor:pointer;border:0;border-radius:11px;background:#e8edfc;color:#293f9d;padding:10px 14px;font-weight:650}button.primary{background:#455bd5;color:white}button:disabled{opacity:.5;cursor:not-allowed}nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.muted{color:#66758e;font-size:14px}.bar{height:9px;background:#e8edfa;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:#6075e9}.answer{display:block;width:100%;text-align:left;margin:8px 0}.answer.chosen{outline:2px solid #5366d8}.tag{display:inline-block;padding:4px 9px;border-radius:30px;background:#eef0ff;margin:4px;font-size:13px}textarea,input{font:inherit;max-width:100%;border:1px solid #cdd5e9;border-radius:9px;padding:10px}textarea{width:100%;min-height:70px}.photo{max-width:100%;max-height:330px;border-radius:12px}.ok{color:#12774c}.bad{color:#ae3041}h2{margin:0 0 10px}h3{margin:10px 0}label{display:inline-block;margin:5px 8px 5px 0}.small{font-size:12px}.spaced{margin:12px 0}</style></head><body><header><h1>🧭 数学探险 V2</h1><p>学懂每个知识点，再向下一关出发</p></header><main id="app"></main><script>
"use strict";
const CH=[{id:"rad",name:"二次根式",icon:"🌱",topics:["概念与性质","最简二次根式","二次根式化简","乘除运算","加减运算","混合运算","综合应用","章节挑战"]},{id:"eq",name:"一元二次方程",icon:"🧩",topics:["方程概念","直接开平方法","因式分解法","配方法","求根公式","根的判别式","综合解法","应用题"]}];
const Q=[
["rad",0,"下列哪个式子是二次根式？",["√5","√(-5)","5²","1/5"],0,"二次根式形如 √a，且 a≥0。"],
["rad",1,"√12 化简后等于？",["2√3","3√2","6","√6"],0,"√12=√(4×3)=2√3。"],
["rad",2,"√50 化简后等于？",["5√2","2√5","25√2","10"],0,"√50=√(25×2)=5√2。"],
["rad",3,"√3×√12 等于？",["6","√15","3","12"],0,"√3×√12=√36=6。"],
["rad",4,"2√3+5√3 等于？",["7√3","7√6","10√3","√21"],0,"同类二次根式的系数相加。"],
["rad",5,"√8+√18 等于？",["5√2","√26","13√2","6√2"],0,"√8=2√2，√18=3√2。"],
["rad",6,"正方形面积为 18，边长为？",["3√2","9","6√2","18"],0,"边长为 √18=3√2。"],
["rad",7,"(√5+√5)² 等于？",["20","10","5","25"],0,"2√5 的平方为 4×5=20。"],
["eq",0,"下列哪个是一元二次方程？",["x²-3x+2=0","x+y=2","x³=1","2x=4"],0,"只有一个未知数，最高次数为 2。"],
["eq",1,"x²=9 的解是？",["x=±3","x=3","x=9","x=-9"],0,"直接开平方要考虑正负两个解。"],
["eq",2,"x²-5x=0 的解是？",["0 或 5","5","0","-5"],0,"提取公因式：x(x-5)=0。"],
["eq",3,"x²+6x+9=0 的解是？",["-3","3","±3","9"],0,"左侧是 (x+3)²。"],
["eq",4,"x²-4x+3=0 的根是？",["1 和 3","-1 和 -3","2 和 3","无实数根"],0,"(x-1)(x-3)=0。"],
["eq",5,"x²+2x+5=0 的判别式是？",["-16","16","24","0"],0,"Δ=b²-4ac=4-20=-16。"],
["eq",6,"x²-1=0 的根是？",["±1","1","-1","0"],0,"平方差分解：(x-1)(x+1)=0。"],
["eq",7,"两连续正整数乘积为 12，较小的数是？",["3","2","4","6"],0,"设较小数 x，则 x(x+1)=12，正整数解为 3。"]
];
const KEY="math_quest_v2_2026";
const fresh=()=>({attempts:[],sheets:[],started:Date.now()});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(S.attempts)||!Array.isArray(S.sheets))throw Error("data");}catch(e){S=fresh()}
let page="home",chapter="rad",level=0,selected=null,photo=null,editTags=[],note="",reviewIndex=0;
const $=id=>document.getElementById(id),save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){alert("本机存储空间不足，请先导出备份");return false}},esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),qid=(c,n)=>c+"-"+n,topic=(c,n)=>CH.find(x=>x.id===c)?.topics[n]||"",attempts=(c,n)=>S.attempts.filter(x=>x.c===c&&x.n===n),passed=(c,n)=>attempts(c,n).some(x=>x.correct),count=c=>CH.find(x=>x.id===c).topics.filter((_,i)=>passed(c,i)).length,go=p=>{page=p;selected=null;render();window.scrollTo(0,0)},open=(c,n)=>{chapter=c;level=n;go("quiz")};
function shell(inner){return '<nav><button onclick="go(\'home\')">🗺️ 闯关</button><button onclick="go(\'sheets\')">📷 试卷本</button><button onclick="go(\'wrong\')">📒 错题本</button><button onclick="go(\'stats\')">📊 学习统计</button></nav>'+inner}
function home(){return '<div class="card"><h2>欢迎回来 👋</h2><p class="muted">选择章节后进入知识地图；每一关都有真实答题反馈。</p></div><div class="grid">'+CH.map(c=>'<div class="card"><h2>'+c.icon+' '+c.name+'</h2><p>已通过 '+count(c.id)+' / 8 关</p><div class="bar"><i style="width:'+(count(c.id)/8*100)+'%"></i></div><button class="primary spaced" onclick="chapter=\''+c.id+'\';go(\'map\')">进入闯关 →</button></div>').join("")+'</div><div class="card"><h3>🎯 学习工具</h3><div class="row"><button onclick="go(\'sheets\')">拍照与试卷本</button><button onclick="go(\'wrong\')">复习错题</button><button onclick="go(\'stats\')">查看进步</button></div></div>'}
function map(){const c=CH.find(x=>x.id===chapter);return '<div class="card"><h2>'+c.icon+' '+c.name+'</h2><p class="muted">学习路线 · 共 8 关</p></div><div class="grid">'+c.topics.map((t,n)=>'<div class="card"><span class="tag">第 '+(n+1)+' 关</span><h3>'+esc(t)+'</h3><p class="muted">'+(passed(chapter,n)?'✅ 已完成':'📘 待学习')+'</p><button class="primary" onclick="open(\''+chapter+'\','+n+')">开始练习 →</button></div>').join("")+'</div>'}
function quiz(){const q=Q.find(x=>x[0]===chapter&&x[1]===level);const a=attempts(chapter,level);return '<div class="card"><div class="row"><h2>'+esc(topic(chapter,level))+'</h2><button onclick="go(\'map\')">返回地图</button></div><p class="muted">本关基础练习 · 已答 '+a.length+' 次</p><h3>'+esc(q[2])+'</h3>'+q[3].map((o,i)=>'<button class="answer '+(selected===i?'chosen':'')+'" '+(selected!==null?'disabled':'')+' onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join("")+(selected===null?'':'<div class="card"><b class="'+(selected===q[4]?'ok':'bad')+'">'+(selected===q[4]?'✓ 回答正确':'✗ 这次没答对')+'</b><p>正确答案：'+esc(q[3][q[4]])+'</p><p>'+esc(q[5])+'</p><button class="primary" onclick="selected=null;render()">再练一次</button> <button onclick="go(\'map\')">返回地图</button></div>')+'</div>'}
function answer(i){if(selected!==null)return;selected=i;const q=Q.find(x=>x[0]===chapter&&x[1]===level);S.attempts.push({c:chapter,n:level,answer:i,correct:i===q[4],at:Date.now()});save();render()}
function wrong(){const wrongs=S.attempts.filter(x=>!x.correct).reverse();return '<div class="card"><h2>📒 错题本</h2><p class="muted">这里只记录真实答错的题，不会把随机练习冒充试卷原题。</p><p>累计错题记录：'+wrongs.length+'</p></div>'+(!wrongs.length?'<div class="card">目前没有错题记录。继续闯关吧！</div>':wrongs.map((a,i)=>'<div class="card"><h3>'+esc(CH.find(c=>c.id===a.c).name)+' · '+esc(topic(a.c,a.n))+'</h3><p>'+esc(Q.find(q=>q[0]===a.c&&q[1]===a.n)[2])+'</p><p class="muted">答错时间：'+new Date(a.at).toLocaleString()+'</p><button onclick="open(\''+a.c+'\','+a.n+')">重新练习</button></div>').join(""))}
function stats(){const total=S.attempts.length,good=S.attempts.filter(x=>x.correct).length;return '<div class="card"><h2>📊 学习统计</h2><p>累计答题：<b>'+total+'</b> 道</p><p>正确率：<b>'+(total?Math.round(good/total*100):0)+'%</b></p><p>已通过关卡：<b>'+CH.reduce((a,c)=>a+count(c.id),0)+'/16</b></p><p>保存的试卷：<b>'+S.sheets.length+'</b> 份</p><p class="muted">统计来自真实作答。学习计时和掌握度模型尚待开发。</p></div><div class="card"><h3>数据备份</h3><button onclick="backup()">导出 JSON 备份</button> <label class="button">导入 JSON 备份<input type="file" accept="application/json" onchange="restore(event)" style="display:none"></label><p class="muted">记录只存储在当前浏览器，清理浏览器数据可能造成丢失。请定期备份。</p></div>'}
function backup(){const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download="math-quest-v2-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function restore(ev){const f=ev.target.files?.[0];if(!f)return;f.text().then(t=>{const s=JSON.parse(t);if(!Array.isArray(s.attempts)||!Array.isArray(s.sheets))throw Error("format");if(!confirm("用备份替换当前学习数据？"))return;S=s;save();render()}).catch(()=>alert("备份文件无效"))}
function sheets(){return '<div class="card"><h2>📷 试卷本</h2><p>上传试卷照片后，可以把整张试卷手动关联到多个知识点。<b>目前不具备自动识题能力，也不会凭照片推断错题。</b></p><label class="button">拍照或上传<input type="file" accept="image/*" capture="environment" onchange="loadPhoto(event)" style="display:none"></label> <label class="button">从相册选择<input type="file" accept="image/*" onchange="loadPhoto(event)" style="display:none"></label></div>'+S.sheets.slice().reverse().map(s=>'<div class="card"><div class="row"><b>📄 '+new Date(s.at).toLocaleDateString()+'</b><button onclick="removeSheet(\''+s.id+'\')">删除</button></div><img class="photo spaced" src="'+s.image+'" alt="试卷照片"><p>'+s.tags.map(k=>'<span class="tag">'+esc(topic(...k.split(":").map((x,i)=>i?Number(x):x)))+'</span>').join("")+'</p><p class="muted">'+esc(s.note)+'</p></div>').join(""))}
function loadPhoto(ev){const f=ev.target.files?.[0];if(!f)return;if(!f.type.startsWith("image/"))return alert("请选择图片");const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,k=Math.min(1,max/img.width),c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);photo=c.toDataURL("image/jpeg",.68);editTags=[];note="";go("tag")};img.src=reader.result};reader.readAsDataURL(f)}
function tag(){return '<div class="card"><h2>📄 保存试卷</h2><img class="photo" src="'+photo+'" alt="试卷预览"><p class="muted">当前是人工关联知识点，不是 AI 自动识别。可同时选择两个章节。</p>'+CH.map(c=>'<h3>'+c.icon+' '+c.name+'</h3>'+c.topics.map((t,i)=>'<label><input type="checkbox" '+(editTags.includes(qid(c.id,i))?'checked':'')+' onchange="toggleTag(\''+c.id+'\','+i+',this.checked)"> '+esc(t)+'</label>').join("")).join("")+'<p><textarea id="sheetNote" placeholder="备注（例如第3题需要复习）">'+esc(note)+'</textarea></p><button class="primary" onclick="saveSheet()">保存到试卷本</button> <button onclick="go(\'sheets\')">取消</button></div>'}
function toggleTag(c,n,on){const k=qid(c,n);editTags=editTags.filter(x=>x!==k);if(on)editTags.push(k)}
function saveSheet(){const s={id:"sh"+Date.now(),at:Date.now(),image:photo,tags:editTags.map(x=>x.replace("-",":")),note:$("sheetNote").value};S.sheets.push(s);if(save()){photo=null;go("sheets")}else S.sheets.pop()}
function removeSheet(id){if(!confirm("确定删除这张试卷？"))return;S.sheets=S.sheets.filter(s=>s.id!==id);save();render()}
function render(){$("app").innerHTML=shell(({home,map,quiz,wrong,stats,sheets,tag})[page]?.()||home())}render();
</script></body></html>
